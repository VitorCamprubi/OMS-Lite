# =============================================================================
# Application
# =============================================================================
spring.application.name=OMS-Lite
server.port=8080

# =============================================================================
# Datasource
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/oms_lite?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# =============================================================================
# JPA / Hibernate
# Schema is owned by Flyway, so Hibernate just validates it.
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Flyway
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
